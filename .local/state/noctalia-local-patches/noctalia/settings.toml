config_version = 15

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 854.0
    cy = 885.0
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "0x1ce/mpris-lyrics", "local/system-monitor" ]
source = [
    { kind = "git", location = "https://github.com/noctalia-dev/official-plugins", name = "official" },
    { kind = "git", location = "https://github.com/noctalia-dev/community-plugins", name = "community" },
    { kind = "git", location = "https://github.com/OHMCFXG/noctalia-plugins.git", name = "personal" }
]

[shell.launcher]
app_grid = false
sort_by_usage = false

[theme]
mode = "light"

[wallpaper.default]
path = "/home/wing/pictures/wallpapers/pixel-art-river-landscape-illustration.jpg"

[wallpaper.last]
path = "/home/wing/pictures/wallpapers/pixel-art-river-landscape-illustration.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/wing/pictures/wallpapers/pixel-art-river-landscape-illustration.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/wing/pictures/wallpapers/pixel-art-river-landscape-illustration.jpg"